name: CMake on multiple platforms

on:
  push:
    branches: ["1101-cxx"]
  pull_request:
    branches: ["1101-cxx"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false

      matrix:
        os: [ubuntu-latest, windows-latest]
        build_type: [Release]
        c_compiler: [clang, cl]
        ui: [false]
        include:
          - os: windows-latest
            c_compiler: cl
            cpp_compiler: cl
            vcpkg_triplet: x64-windows-static
          - os: ubuntu-latest
            c_compiler: clang
            cpp_compiler: clang++
            vcpkg_triplet: x64-linux-release
        exclude:
          - os: windows-latest
            c_compiler: gcc
          - os: windows-latest
            c_compiler: clang
          - os: ubuntu-latest
            c_compiler: cl

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies (Only Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential make pkg-config cmake ninja-build \
            gnome-desktop-testing \
            libasound2-dev libpulse-dev libaudio-dev libfribidi-dev \
            libjack-dev libsndio-dev \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev \
            libxfixes-dev libxi-dev libxss-dev libxtst-dev \
            libxkbcommon-dev libdrm-dev libgbm-dev \
            libgl1-mesa-dev libgles2-mesa-dev libegl1-mesa-dev \
            libdbus-1-dev libibus-1.0-dev libudev-dev libthai-dev \
            libusb-1.0-0-dev

      - name: Set reusable strings
        id: strings
        shell: bash
        run: |
          echo "build-output-dir=${{ github.workspace }}/build" >> "$GITHUB_OUTPUT"

      - name: vcpkg build
        id: vcpkg
        uses: johnwason/vcpkg-action@v8
        with:
          manifest-dir: ${{ github.workspace }}
          triplet: ${{ matrix.vcpkg_triplet }}
          token: ${{ github.token }}

      - name: Configure CMake
        run: >
          cmake -B ${{ steps.strings.outputs.build-output-dir }}
          -DCMAKE_TOOLCHAIN_FILE=${{ github.workspace }}/vcpkg/scripts/buildsystems/vcpkg.cmake
          -DVCPKG_TARGET_TRIPLET=${{ matrix.vcpkg_triplet }}
          -DCMAKE_CXX_COMPILER=${{ matrix.cpp_compiler }}
          -DCMAKE_C_COMPILER=${{ matrix.c_compiler }}
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
          -DBUILD_UI=${{ matrix.ui }}
          -S ${{ github.workspace }}

      - name: Build
        run: cmake --build ${{ steps.strings.outputs.build-output-dir }} --config ${{ matrix.build_type }}

      - name: Prepare unique binary name
        shell: bash
        run: |
          mkdir -p dist
          NAME="DisasterServer_${{ matrix.os }}_${{ matrix.c_compiler }}"
          BUILD="${{ steps.strings.outputs.build-output-dir }}"

          FOUND=0
          for pattern in \
            "$BUILD/disasterserver/Release/DisasterServerCXX.exe" \
            "$BUILD/disasterserver/DisasterServerCXX" \
          ; do
            if [ -f "$pattern" ]; then
              BASENAME=$(basename "$pattern" .exe)
              EXT=""
              [[ "$pattern" == *.exe ]] && EXT=".exe"
              cp "$pattern" "dist/${NAME}${EXT}"
              echo "Copied: $pattern -> dist/${NAME}${EXT}"
              FOUND=1
            fi
          done

          if [ "$FOUND" = "0" ]; then
            echo "=== Binary not found. Searching build tree: ==="
            find "$BUILD" -type f \( -name "DisasterServer*" -o -name "*.exe" \) 2>/dev/null | head -50
            exit 1
          fi

          echo "=== dist contents ==="
          ls -la dist/

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: DisasterServer_${{ matrix.os }}_${{ matrix.c_compiler }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  release:
    name: Create Pre-Release 1101-cxx
    needs: build
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./dist
          merge-multiple: true

      - name: List files
        run: ls -la ./dist

      - name: Create Pre-Release server_cxx
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.action }}.cxx
          name: "DisasterServer on C++ (pre-release)"
          body: |
            Automatic C++ build from commit `${{ github.sha }}`.
            **This is a pre-release (unfinished) build. Use at your own risk!**
          files: ./dist/*
          draft: false
          prerelease: true
          make_latest: false
