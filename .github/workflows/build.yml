name: CMake on multiple platforms

on:
  push:
    branches: ["1101-oss"]
  pull_request:
    branches: ["1101-oss"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        build_type: [Release]
        c_compiler: [gcc, clang, cl]
        ui: [true, false]
        include:
          - os: windows-latest
            c_compiler: cl
            cpp_compiler: cl
          - os: ubuntu-latest
            c_compiler: gcc
            cpp_compiler: g++
          - os: ubuntu-latest
            c_compiler: clang
            cpp_compiler: clang++
        exclude:
          - os: windows-latest
            c_compiler: gcc
          - os: windows-latest
            c_compiler: clang
          - os: ubuntu-latest
            c_compiler: cl

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake ninja-build pkg-config \
            libasound2-dev libpulse-dev libfribidi-dev libjack-dev \
            libsndio-dev libx11-dev libxext-dev libxrandr-dev \
            libxcursor-dev libxfixes-dev libxi-dev libxss-dev \
            libxtst-dev libxkbcommon-dev libdrm-dev libgbm-dev \
            libgl1-mesa-dev libgles2-mesa-dev libegl1-mesa-dev \
            libdbus-1-dev libibus-1.0-dev libudev-dev libthai-dev \
            libusb-1.0-0-dev libsdl2-dev

      - name: Set build dir
        id: strings
        shell: bash
        run: |
          echo "build-output-dir=${{ github.workspace }}/build" >> "$GITHUB_OUTPUT"

      - name: Configure CMake
        run: >
          cmake -B ${{ steps.strings.outputs.build-output-dir }}
          -DCMAKE_CXX_COMPILER=${{ matrix.cpp_compiler }}
          -DCMAKE_C_COMPILER=${{ matrix.c_compiler }}
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
          -DBUILD_UI=${{ matrix.ui }}
          -S ${{ github.workspace }}

      - name: Build
        run: cmake --build ${{ steps.strings.outputs.build-output-dir }} --config ${{ matrix.build_type }}

      - name: Prepare unique binary name
        shell: bash
        run: |
          mkdir -p dist
          NAME="DisasterServer-${{ matrix.os }}-${{ matrix.c_compiler }}-ui-${{ matrix.ui }}"
          BUILD="${{ steps.strings.outputs.build-output-dir }}"

          if [ -f "$BUILD/disasterserver/Release/DisasterServer.exe" ]; then
            cp "$BUILD/disasterserver/Release/DisasterServer.exe" "dist/${NAME}.exe"
          elif [ -f "$BUILD/disasterserver/DisasterServer.exe" ]; then
            cp "$BUILD/disasterserver/DisasterServer.exe" "dist/${NAME}.exe"
          elif [ -f "$BUILD/disasterserver/DisasterServer" ]; then
            cp "$BUILD/disasterserver/DisasterServer" "dist/${NAME}"
          else
            echo "Binary not found"; find "$BUILD" -name "DisasterServer*"; exit 1
          fi
          ls -la dist/

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: DisasterServer-${{ matrix.os }}-${{ matrix.c_compiler }}-ui-${{ matrix.ui }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  release:
    name: Create Release 1101-oss
    needs: build
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./dist
          merge-multiple: true

      - name: List files
        run: ls -la ./dist

      - name: Delete old tag 1101-oss
        continue-on-error: true
        run: git push origin :refs/tags/1101-oss

      - name: Create Release 1101-oss
        uses: softprops/action-gh-release@v2
        with:
          tag_name: 1101-oss
          name: "1101-oss"
          body: |
            Automatic build from commit `${{ github.sha }}`.
          files: ./dist/*
          draft: false
          prerelease: false
          make_latest: false
